name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production WASM
        run: >-
          node --input-type=module -e 'import fs from "node:fs";
          const wasm = fs.readFileSync("pkg/arkade_city_bg.wasm");
          if (wasm.includes(Buffer.from("http://127.0.0.1:7070")))
          throw new Error("refusing to deploy a regtest-enabled WASM package");'
      - name: Stage static site
        run: |
          mkdir _site
          cp index.html game.css web.js _site/
          cp -R pkg _site/pkg
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
